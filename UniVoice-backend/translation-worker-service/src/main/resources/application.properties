server.port=8083
spring.application.name=translation-worker-service

spring.datasource.url=jdbc:mysql://localhost:3306/univoice_translation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=rawMessage:com.univoice.translation.event.RawMessageEvent,translatedMessage:com.univoice.translation.event.TranslatedMessageEvent,rawGroupMessage:com.univoice.translation.event.RawGroupMessageEvent,translatedGroupMessage:com.univoice.translation.event.TranslatedGroupMessageEvent

spring.kafka.consumer.group-id=translation-worker-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=rawMessage:com.univoice.translation.event.RawMessageEvent,translatedMessage:com.univoice.translation.event.TranslatedMessageEvent,rawGroupMessage:com.univoice.translation.event.RawGroupMessageEvent,translatedGroupMessage:com.univoice.translation.event.TranslatedGroupMessageEvent

# Topics
app.kafka.raw-messages-topic=chat-messages-raw
app.kafka.translated-messages-topic=chat-messages-translated
app.kafka.raw-group-messages-topic=group-messages-raw
app.kafka.translated-group-messages-topic=group-messages-translated

# Internal Service URI
app.services.user-service-url=http://user-service/api/v1/users

# Sarvam AI
app.sarvam.api-url=https://api.sarvam.ai
app.sarvam.api-key=secret key
app.sarvam.model=mayura:v1
app.sarvam.mode=formal


app.global-translate.api-url=https://api.groq.com/openai/v1
app.global-translate.api-key=secret key
app.global-translate.model=openai/gpt-oss-120b

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


