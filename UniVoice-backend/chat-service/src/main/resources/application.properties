server.port=8082
spring.application.name=chat-service

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/univoice_chat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret matching user-service
app.jwt.secret=${JWT_SECRET_KEY}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.translation.enabled=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=rawMessage:com.univoice.chat.event.RawMessageEvent,translatedMessage:com.univoice.chat.event.TranslatedMessageEvent,rawGroupMessage:com.univoice.chat.event.RawGroupMessageEvent,translatedGroupMessage:com.univoice.chat.event.TranslatedGroupMessageEvent

spring.kafka.consumer.group-id=chat-service-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=rawMessage:com.univoice.chat.event.RawMessageEvent,translatedMessage:com.univoice.chat.event.TranslatedMessageEvent,rawGroupMessage:com.univoice.chat.event.RawGroupMessageEvent,translatedGroupMessage:com.univoice.chat.event.TranslatedGroupMessageEvent

# Topics
app.kafka.raw-messages-topic=chat-messages-raw
app.kafka.translated-messages-topic=chat-messages-translated
app.kafka.raw-group-messages-topic=group-messages-raw
app.kafka.translated-group-messages-topic=group-messages-translated

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
