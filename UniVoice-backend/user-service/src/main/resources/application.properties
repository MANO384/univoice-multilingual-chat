server.port=8081
spring.application.name=user-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/univoice_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT configuration (Matching secret across microservices, 24 hours expiry for dev)
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.access-expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# SMS Provider fallback to console for development
app.sms.provider=console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
