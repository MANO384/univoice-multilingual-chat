server.port=8080
spring.application.name=api-gateway

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=false

# 1. Route to User & Auth Service (REST APIs)
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**,/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=userServiceCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/users

# 2. Route to Chat Service (REST APIs)
spring.cloud.gateway.routes[1].id=chat-service-rest-route
spring.cloud.gateway.routes[1].uri=lb://chat-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/chats/**,/api/v1/groups/**,/ws/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=chatServiceCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/chats

# 3. Route to Chat Service (WebSocket STOMP handshake)
spring.cloud.gateway.routes[2].id=chat-service-websocket-route
spring.cloud.gateway.routes[2].uri=lb:ws://chat-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/ws-chat/**

# Global CORS Configuration (Explicit Vite origins with credentials)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway